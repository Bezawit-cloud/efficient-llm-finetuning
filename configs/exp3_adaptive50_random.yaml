# E3 — Adaptive 50% subset, random order (selection only, no curriculum)
# Run: python src/train_baseline.py --config configs/exp3_adaptive50_random.yaml

experiment:
  id: "E3"
  name: "adaptive50_random_order"
  description: "Top-50% by importance score, random order. Isolates the effect of adaptive selection."

data:
  selection:
    method: "adaptive"       # top-k% by importance score
    fraction: 0.50
  ordering: "random"

training:
  output_dir: "outputs/E3_adaptive50_random"

seed: 42
