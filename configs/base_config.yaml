# ─────────────────────────────────────────────────────────────────────────────
# Base configuration — shared by all experiments
# Override per-experiment in configs/expN.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── Model ────────────────────────────────────────────────────────────────────
model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  fallback: "HuggingFaceTB/SmolLM2-360M-Instruct"
  # Switch to fallback if single-run wall-clock > 20 min (measured on Day 1)
  use_fallback: false

# ── LoRA ─────────────────────────────────────────────────────────────────────
lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# ── Data ─────────────────────────────────────────────────────────────────────
data:
  dataset_name: "tatsu-lab/alpaca"
  max_samples: null          # null = use all 52k; set int for quick sanity runs
  eval_split_ratio: 0.05     # 5% held-out eval from the training set
  max_seq_length: 384        # reduced from 512 — cuts activation memory ~25% on T4
  seed: 42

# ── Scoring (α + β + γ = 1.0) ────────────────────────────────────────────────
scoring:
  alpha: 0.333   # diversity weight
  beta:  0.333   # complexity weight
  gamma: 0.334   # response-length quality proxy weight
  embedding_model: "all-MiniLM-L6-v2"   # used for diversity embedding

# ── Training ─────────────────────────────────────────────────────────────────
# T4 (14.56 GB) high-throughput budget:
#   Model (fp16):        ~1.0 GB
#   LoRA grads/optim:    ~0.05 GB (AdamW torch)
#   Activations:         ~1.0 GB  (batch=16, seq=384, no ckpt)
#   lm_head logits:      ~1.8 GB  (16 × 384 × 151936 × 2B)
#   Overhead / reserved: ~1.5 GB
#   ─────────────────────────────
#   Estimated peak:      ~5.3 GB  (Safe margin for 14.56 GB T4, ~9 GB headroom)
# Effective batch size = per_device_train_batch_size × gradient_accumulation_steps = 16 × 2 = 32
training:
  num_train_epochs: 1
  per_device_train_batch_size: 16   # maximized for GPU Tensor Core utilization
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 2    # keeps effective batch size at 32
  gradient_checkpointing: false     # disabled to eliminate 35% recomputation overhead
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 0.03      # transformers v5: float < 1.0 is treated as a ratio of total steps
  weight_decay: 0.001
  fp16: true              # enabled for NVIDIA T4 Tensor Cores
  bf16: false             # set true if A100 / H100
  optim: "adamw_torch"    # native PyTorch fused/standard AdamW for minimal dispatch latency
  save_strategy: "epoch"  # checkpoint every epoch — crash safety
  eval_strategy: "epoch"
  logging_steps: 50
  output_dir: "outputs"
  dataloader_num_workers: 2  # asynchronous CPU pre-fetching on Linux (Kaggle)

# ── Evaluation ───────────────────────────────────────────────────────────────
evaluation:
  eval_set_size: 200          # fixed eval set for LLM-judged win-rate
  metrics:
    - "eval_loss"
    - "rouge_l"

# ── Reproducibility ──────────────────────────────────────────────────────────
seed: 42
